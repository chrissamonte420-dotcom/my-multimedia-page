<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Multimedia Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>SAMONTE MULTIMEDIA</h1>


    <div class="media-container">
        <h2>My Image</h2>

        <img src="image/pilots.webp" alt="Pilots" width="300">
        <img src="image/my-own.jpg" alt="My Picture" width="300">
        <img src="image/sponge.jpg" alt="SpongeBob" width="300">
        <img src="image/team.jpg" alt="Team" width="200">
        <img src="image/dota22.jpg" alt="My Picture" width="320">
    </div>


    <div class="media-container">
        <h2>Music List</h2>

        <audio controls>
            <source src="song/summer.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>

        <br><br>

        <audio controls>
            <source src="song/lwky.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>

    <div class="media-container">
        <h2>My Video collection</h2>

        <video width="640" height="360" controls>
            <source src="video/dota33.mp4" type="video/mp4">
        </video>

        <video width="640" height="360" controls>
            <source src="video/rampage.mp4" type="video/mp4">
        </video>

        

        
    </div>

</body>
</html>
